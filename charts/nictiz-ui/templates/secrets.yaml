{{- /*
Chart-owned credentials, generated at install time.

STICKY across upgrades: each value is re-read from the live Secret (lookup)
and only generated when absent, so `helm upgrade` never rotates a credential
behind the running pods' backs. The registration Job pushes the same values
into the Keycloak realm on every install/upgrade, which is what makes the
realm and these Secrets agree by construction.

(`helm template`/CI has no cluster to look up, so it renders fresh random
values — fine, nothing consumes an offline render's secrets.)
*/ -}}
{{- $ns := .Release.Namespace -}}

{{- $oidcPrev := (lookup "v1" "Secret" $ns .Values.oidc.secretName).data | default dict -}}
{{- $oidcSecret := .Values.oidc.clientSecret -}}
{{- if not $oidcSecret -}}
{{- if hasKey $oidcPrev .Values.oidc.clientSecretKey -}}
{{- $oidcSecret = index $oidcPrev .Values.oidc.clientSecretKey | b64dec -}}
{{- else -}}
{{- $oidcSecret = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.oidc.secretName }}
  labels:
    {{- include "nictiz-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.oidc.clientIdKey }}: {{ .Values.oidc.clientId | quote }}
  {{ .Values.oidc.clientSecretKey }}: {{ $oidcSecret | quote }}
{{- if .Values.auth.oauth2Proxy.enabled }}
---
{{- $proxyPrev := (lookup "v1" "Secret" $ns .Values.auth.oauth2Proxy.secretName).data | default dict -}}
{{- $proxySecret := .Values.auth.oauth2Proxy.clientSecret -}}
{{- if not $proxySecret -}}
{{- if hasKey $proxyPrev "OAUTH2_PROXY_CLIENT_SECRET" -}}
{{- $proxySecret = index $proxyPrev "OAUTH2_PROXY_CLIENT_SECRET" | b64dec -}}
{{- else -}}
{{- $proxySecret = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- $cookieSecret := .Values.auth.oauth2Proxy.cookieSecret -}}
{{- if not $cookieSecret -}}
{{- if hasKey $proxyPrev "OAUTH2_PROXY_COOKIE_SECRET" -}}
{{- $cookieSecret = index $proxyPrev "OAUTH2_PROXY_COOKIE_SECRET" | b64dec -}}
{{- else -}}
{{- $cookieSecret = randAlphaNum 32 -}}
{{- end -}}
{{- end -}}
{{- if not (has (len $cookieSecret) (list 16 24 32)) -}}
{{- fail "auth.oauth2Proxy.cookieSecret must be exactly 16, 24 or 32 characters (oauth2-proxy cookie encryption)" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.oauth2Proxy.secretName }}
  labels:
    {{- include "nictiz-ui.oauth2ProxyLabels" . | nindent 4 }}
type: Opaque
stringData:
  OAUTH2_PROXY_CLIENT_SECRET: {{ $proxySecret | quote }}
  OAUTH2_PROXY_COOKIE_SECRET: {{ $cookieSecret | quote }}
{{- end }}
{{- if .Values.keycloak.demoUser.enabled }}
---
{{- $demoPrev := (lookup "v1" "Secret" $ns .Values.keycloak.demoUser.secretName).data | default dict -}}
{{- $demoPassword := .Values.keycloak.demoUser.password -}}
{{- if not $demoPassword -}}
{{- if hasKey $demoPrev "password" -}}
{{- $demoPassword = index $demoPrev "password" | b64dec -}}
{{- else -}}
{{- $demoPassword = randAlphaNum 20 -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.keycloak.demoUser.secretName }}
  labels:
    {{- include "nictiz-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.keycloak.demoUser.username | quote }}
  password: {{ $demoPassword | quote }}
{{- end }}
