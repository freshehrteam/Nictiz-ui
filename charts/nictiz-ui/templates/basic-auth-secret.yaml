{{- if and .Values.auth.basicAuth.enabled .Values.auth.basicAuth.create }}
{{- /*
The htpasswd Secret backing the ingress basic-auth gate.

OFF by default, and that default is the right one for anything real: this holds
the only credential standing between the public internet and every record in the
CDR, and rendering it from a values file puts it one `git add` away from being
public. Create it out-of-band instead (see values.yaml for the exact commands).

Enabling this is for throwaway demo clusters where the convenience is worth more
than the exposure.
*/ -}}
{{- if not .Values.auth.basicAuth.htpasswd }}
{{- fail "auth.basicAuth.create=true requires auth.basicAuth.htpasswd (htpasswd-format: user:$2y$...). Generate with: htpasswd -nbB <user> '<password>'" }}
{{- end }}
{{- if not (regexMatch "^[^:]+:\\$" .Values.auth.basicAuth.htpasswd) }}
{{- /*
Guards the single most likely mistake here. nginx compares the request against a
HASH; given a plaintext password it does not error, it simply rejects every
login — which presents as "basic-auth is broken" rather than "the value is in
the wrong format".
*/ -}}
{{- fail "auth.basicAuth.htpasswd must be htpasswd-format (user:$2y$...), not a plaintext password. Generate with: htpasswd -nbB <user> '<password>'" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nictiz-ui.basicAuthSecretName" . }}
  labels:
    {{- include "nictiz-ui.labels" . | nindent 4 }}
type: Opaque
stringData:
  # ingress-nginx requires this key to be named exactly `auth`.
  auth: {{ .Values.auth.basicAuth.htpasswd | quote }}
{{- end }}
