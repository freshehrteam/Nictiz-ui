{{- if .Values.networkPolicy.enabled }}
{{- /*
Restricts who may open a connection to this pod.

The BFF trusts the identity its proxy asserts — that is inherent to any
forward-auth design, and it is why `requireUpstreamAuth` alone is not the whole
story: a caller INSIDE the cluster that can reach port 3001 directly can set
`X-Auth-Request-User` itself and be believed, bypassing the Keycloak login
entirely.

The ingress path is not the risk (nginx is the only route in from outside). The
risk is lateral: another workload in the cluster, or a `kubectl port-forward`
from anyone with namespace access. This policy makes the ingress controller the
only thing that can reach the pod, which turns the BFF's trust in the header
from an assumption into something the network actually enforces.

Requires a CNI that enforces NetworkPolicy. k3s ships a kube-router-based policy
controller enabled by default (the stack's cloud-init does not pass
--disable-network-policy), so this IS enforced on the Hetzner target. On a
cluster whose CNI ignores NetworkPolicy the object still applies cleanly and
simply does nothing — which is why the default here is on, but verify before
relying on it. See values.yaml.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nictiz-ui.fullname" . }}
  labels:
    {{- include "nictiz-ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nictiz-ui.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Only the ingress-nginx controller may connect.
    - from:
        {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
{{- if .Values.auth.oauth2Proxy.enabled }}
---
{{/*
Same restriction for the oauth2-proxy pod. Less load-bearing than the BFF's —
the proxy authenticates rather than trusts — but a session-holding auth
component reachable from every workload in the cluster is needless surface.
Only ingress-nginx talks to it (auth-url subrequests + the /oauth2 paths).
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nictiz-ui.fullname" . }}-oauth2-proxy
  labels:
    {{- include "nictiz-ui.oauth2ProxyLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nictiz-ui.oauth2ProxySelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.allowFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 4180
{{- end }}
{{- end }}
