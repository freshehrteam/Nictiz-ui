# ============================================================================
# Hetzner (prod) values — k3s on hcloud, alongside the health-stack release.
#
#   helm upgrade --install nictiz-ui charts/nictiz-ui \
#     -n health-stack \
#     -f charts/nictiz-ui/values-hetzner.yaml \
#     --set image.tag=0.1.0
#
# The namespace MUST be the one the health-stack release occupies (health-stack).
# The BFF resolves ehrbase/hapi/openfhir by bare Service name and reads its
# Keycloak client secrets from that release's Secrets; both are namespace-local.
# ============================================================================

# Pin an immutable tag in production. CI publishes both a semver and a sha tag —
# `latest` would mean a rolling restart silently changes which build is serving.
image:
  repository: ghcr.io/freshehrteam/nictiz-ui
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

ingress:
  # The single source of truth for this host: the registration Job derives the
  # freshehr realm's redirect URI (https://<host>/oauth2/callback) from it, so
  # realm and ingress cannot drift. Must resolve to the stack's LB IP.
  host: nictiz-demo.freshehr.com

  # Specifying this block REPLACES values.yaml's annotations map rather than
  # merging into it, so proxy-body-size has to be repeated here. Dropping it
  # would 413 OPT and Bundle uploads mid-save. (The auth-url/auth-signin
  # annotations are NOT here — the template emits them itself, precisely so an
  # override like this one cannot accidentally drop the access control.)
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"

  tls:
    enabled: true
    # cert-manager + this ClusterIssuer are installed by the stack's Terraform
    # (modules/k8s-apps). This chart references it; it does not create it.
    clusterIssuer: letsencrypt-prod
    secretName: nictiz-ui-tls

# The freshehr realm's PUBLIC issuer — on the health-stack host (terraform's
# `domain`), NOT this chart's ingress.host. The UI's oauth2-proxy fetches OIDC
# discovery from it and sends the browser there to log in.
oidc:
  issuerUrl: https://nictiz.open-fhir.com/auth/realms/freshehr

auth:
  # Fail closed: the BFF refuses anything that did not come through the ingress.
  required: true

  # Browser login (session-mode oauth2-proxy against the freshehr realm).
  # Client + cookie secrets are generated by this chart at install (sticky
  # across upgrades) — nothing secret lives in this file.
  oauth2Proxy:
    enabled: true

  # Only the local-dev fallback; with the proxy in front every composition is
  # filed under the logged-in user.
  defaultUserName: Demo User

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: "1"
    memory: 512Mi
