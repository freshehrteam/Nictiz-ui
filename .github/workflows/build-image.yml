# Build & push the nictiz-ui container image to GHCR.
#
#   ghcr.io/freshehrteam/nictiz-ui  = the SPA (built by Vite) + the BFF, in one image.
#
# The Helm chart in charts/nictiz-ui references it via `image.repository` /
# `image.tag`. Mirrors the health-stack repo's build-images.yml, including its
# tagging scheme, so the two halves of the deployment are pinned the same way.
#
# No repo secrets needed: pushes authenticate with the workflow's own GITHUB_TOKEN
# (the image job requests `packages: write`). ONE-TIME step after the first push:
# GHCR creates the package private, so flip it to Public
# (github.com/orgs/freshehrteam/packages → nictiz-ui → Package settings → Danger
# Zone → Change visibility). Until then every pull fails with "pull access denied"
# even though the workflow is green.
name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "fixtures/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-image.yml"
  pull_request:
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # GHCR namespace (must be lowercase); matches the pins in charts/nictiz-ui.
  IMAGE_ORG: freshehrteam

jobs:
  # Tests gate the image. The build itself runs `tsc` (so type errors already
  # fail it), but nothing in the Docker build executes the unit tests — and the
  # composer/identity wiring they cover is exactly the kind of thing that fails
  # silently in production rather than loudly at build time.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Pull requests build but do NOT push: a PR from a fork does not get a
      # write-scoped GITHUB_TOKEN, and an unreviewed branch should not publish a
      # tag that a cluster might pull.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/nictiz-ui
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          # Repo root, not app/ — the image needs fixtures/ from above app/.
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
